services:
  rcu-service:
    build: ./service-python
    restart: unless-stopped
    # Runs as the host uid that owns work/, like every container that touches
    # it. Nothing here writes -- only scripts/build_index.py does, and that is
    # the `extract` service -- so the mount is read-only as well.
    user: "${RCU_UID:-1000}:${RCU_GID:-1000}"
    environment:
      RCU_SERVICE_HOST: 0.0.0.0
      RCU_INTERNAL_TOKEN: ${RCU_INTERNAL_TOKEN:?set RCU_INTERNAL_TOKEN in .env}
      RCU_INDEX_PATH: /data/work/index/tokens.npz
      RCU_FP_DIR: /data/work/fp
      RCU_WATERMARK_FILTER: ${RCU_WATERMARK_FILTER:-1}
      RCU_WATERMARK_TERMS: ${RCU_WATERMARK_TERMS:-PULTOVNET}
    volumes:
      - ./work:/data/work:ro
      - ${RCU_FILES_DIR:-./files}:/data/files:ro
    # No ports: the service is reachable only on the internal network. It has
    # no TLS and its shared-secret header is not a substitute for that.
    networks: [internal]
    # The fingerprint store loads the whole catalogue eagerly and a 12 MP query
    # allocates a further ~350 MB of Lab and distance arrays while segmenting,
    # so the ceiling has to move with the catalogue. It has twice been found by
    # the process dying mid-request with no traceback and OOMKilled=false,
    # which reads as a crash rather than as a limit:
    #
    #   9668 records   store ~640 MB   1g was too small
    #  13584 records   store ~680 MB   1500m was too small
    #
    # The real fix is a lazy store -- measured at 22 ms to read the ~156
    # fingerprints a query actually touches, against 228 MB and 9 s of startup
    # to hold them all. Until then this number is a running cost of the eager
    # one, and it needs raising every time the catalogue grows.
    mem_limit: ${RCU_SERVICE_MEM:-2500m}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8600/health"]
      interval: 30s
      timeout: 5s
      start_period: 60s

  laravel:
    build: ./backend-laravel
    restart: unless-stopped
    depends_on:
      mysql: {condition: service_healthy}
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_KEY: ${APP_KEY:?run `php artisan key:generate --show` and set APP_KEY}
      APP_DEBUG: ${APP_DEBUG:-false}
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_DATABASE: ${DB_DATABASE:-rcu}
      DB_USERNAME: ${DB_USERNAME:-rcu}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      LEGACY_DB_HOST: ${LEGACY_DB_HOST:-mysql}
      LEGACY_DB_PORT: ${LEGACY_DB_PORT:-3306}
      LEGACY_DB_DATABASE: ${LEGACY_DB_DATABASE:-rcud}
      LEGACY_DB_USERNAME: ${LEGACY_DB_USERNAME:-}
      LEGACY_DB_PASSWORD: ${LEGACY_DB_PASSWORD:-}
      # Set to connect over the host's MySQL socket instead of TCP -- see
      # LEGACY_DB_SOCKET_DIR below. Empty means TCP, which is the default.
      LEGACY_DB_SOCKET: ${LEGACY_DB_SOCKET:-}
      RCU_SERVICE_URL: http://rcu-service:8600
      RCU_SERVICE_TOKEN: ${RCU_INTERNAL_TOKEN}
      RCU_LEGACY_FILES: /data/files
      RCU_ITEM_URL: ${RCU_ITEM_URL:-https://pultov.net/item/{id}}
      RCU_FP_DIR: /data/work/fp
      RCU_NORM_DIR: /data/work/norm
      RCU_DEBUG_DIR: /data/work/debug
      # The /try test page has no auth at all: it serves catalog crops and
      # match internals to anyone who can reach it. Default off, so a box only
      # gets it by asking. Do not set this on a publicly reachable deployment
      # without putting authentication in front of the route first.
      RCU_TRY_PAGE: ${RCU_TRY_PAGE:-false}
      # Hide the matcher's diagnostics on /try: scores, inlier and button
      # counts, record ids, and the feedback buttons that depend on them.
      # Presentation only -- the API returns the same payload either way.
      RCU_TRY_SIMPLE: ${RCU_TRY_SIMPLE:-false}
    volumes:
      - ./work:/data/work:ro
      - ${RCU_FILES_DIR:-./files}:/data/files:ro
      - laravel-storage:/srv/app/storage
      # The host's MySQL socket directory, so the legacy catalogue can be read
      # without opening that database to TCP. Inert unless LEGACY_DB_SOCKET is
      # set. Harmless when the host runs no MySQL: Docker creates the source
      # directory empty and nothing looks inside it.
      - ${LEGACY_DB_SOCKET_DIR:-/var/run/mysqld}:/var/run/mysqld
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks: [internal]

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on: [laravel]
    ports:
      - "${HTTP_BIND:-127.0.0.1}:${HTTP_PORT:-8080}:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./backend-laravel/public:/srv/app/public:ro
    networks: [internal]

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-rcu}
      MYSQL_USER: ${DB_USERNAME:-rcu}
      MYSQL_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD in .env}
    volumes:
      - mysql-data:/var/lib/mysql
    networks: [internal]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Batch catalog build. Not a service -- `--profile build` keeps it out of
  # `up`. One image per process: a directory run in one process is OOM-killed,
  # and peak RSS is ~700 MB on a 5 MP image.
  #   docker compose --profile build run --rm extract
  extract:
    build: ./service-python
    profiles: [build]
    # The one container that writes to work/. It must be the uid that owns it
    # on the host, or the build artefacts come out root-owned and the host
    # needs another container just to delete them.
    user: "${RCU_UID:-1000}:${RCU_GID:-1000}"
    environment:
      RCU_WATERMARK_FILTER: ${RCU_WATERMARK_FILTER:-1}
      RCU_WATERMARK_TERMS: ${RCU_WATERMARK_TERMS:-PULTOVNET}
    volumes:
      - ./work:/data/work
      - ${RCU_FILES_DIR:-./files}:/data/files:ro
      - ./docker/build-catalog.sh:/usr/local/bin/build-catalog:ro
    networks: [internal]
    mem_limit: 2g
    entrypoint: ["build-catalog"]

networks:
  internal:
    driver: bridge
    # Pinned so a database grant issued to this subnet cannot silently break.
    # Compose otherwise allocates from the shared 172.17-172.31 pool in
    # creation order, and the stack can move if another project claims the
    # range while this one is down.
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  mysql-data:
  laravel-storage:
