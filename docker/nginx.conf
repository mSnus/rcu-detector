server {
    listen 80;
    server_name _;
    root /srv/app/public;
    index index.php;

    # Must be at least RCU_MAX_UPLOAD_KB, or an oversized photo is rejected
    # here with a 413 instead of reaching Laravel's validator.
    client_max_body_size 32m;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass laravel:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        # Recognition is 2-7s with OCR, and a cold first request pays for
        # model loading on top.
        fastcgi_read_timeout 120s;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
