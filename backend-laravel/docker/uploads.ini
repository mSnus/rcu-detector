; PHP's own upload ceiling has to sit above the application's, or the
; application's limit never applies and its error message never runs.
;
; The default php:8.2-fpm image ships upload_max_filesize=2M and
; post_max_size=8M. RCU_MAX_UPLOAD_KB defaults to 10240 (10 MB) and nginx
; allows 24m, so every phone photograph over 2 MB was discarded by PHP before
; Laravel saw it: the request arrived with no file, validation reported "The
; photo failed to upload", and the page told the user to take another photo --
; which would fail identically, being another phone photograph.
;
; Set above the application limit, not equal to it. post_max_size covers the
; whole body, and a multipart body is the file plus its boundaries and the
; other fields; if the two are equal, a file exactly at the limit is rejected
; by the outer check with the less useful message.
upload_max_filesize = 12M
post_max_size = 14M
